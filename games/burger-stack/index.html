<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Burger Stack</title>
    <style>
      html:root { --bg: #f6e3c4; --ink: #ffffff; --shade: #8a3324; --gold: #ffd84a; --paper: #fffaf0; }
      body { overflow: hidden; user-select: none; -webkit-user-select: none; }
      #stage { position: fixed; inset: 0; touch-action: none; }
      .hud { position: fixed; z-index: 4; pointer-events: none; color: var(--ink); font-family: 'Kenney Bold', sans-serif;
        text-shadow: 0 3px 0 var(--shade), 0 -2px 0 var(--shade), 2px 0 0 var(--shade), -2px 0 0 var(--shade); }
      #clock { top: 10px; left: 50%; transform: translateX(-50%); font-size: clamp(34px, 7vw, 50px); transition: color 0.2s; }
      #clock.hurry { color: #ffd0c8; animation: throb 0.5s infinite alternate; }
      @keyframes throb { to { transform: translateX(-50%) scale(1.12); } }
      #cash { top: 12px; right: 16px; font-size: clamp(30px, 6vw, 44px); color: var(--gold); }
      #served { top: calc(18px + clamp(30px, 6vw, 44px)); right: 18px; font-size: 14px; }
      /* The order ticket, pinned up on the left. */
      #ticket { position: fixed; z-index: 4; top: 64px; left: 14px; pointer-events: none; background: var(--paper); color: #5b3a24;
        border-radius: 6px 6px 2px 2px; padding: 8px 12px 10px; font-family: 'Kenney Future', sans-serif; font-size: 13px;
        box-shadow: 0 6px 0 rgba(0,0,0,0.15); transform: rotate(-2deg); min-width: 140px; }
      #ticket::before { content: ''; position: absolute; top: -6px; left: 50%; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: #d8473a; box-shadow: 0 2px 0 #8a3324; }
      #ticket.fresh { animation: slip 0.45s cubic-bezier(.2,1.5,.4,1); }
      @keyframes slip { from { transform: translateY(-140%) rotate(-12deg); } }
      #ticket h3 { margin: 0 0 4px; font: 16px 'Kenney Bold', sans-serif; display: flex; justify-content: space-between; border-bottom: 2px dashed #e3c9a8; padding-bottom: 4px; }
      #ticket-items { display: flex; flex-direction: column-reverse; gap: 1px; }
      #ticket-items div { display: flex; align-items: center; gap: 6px; opacity: 0.85; transition: opacity 0.2s; }
      #ticket-items img { width: 34px; height: 34px; }
      #ticket-items .done { opacity: 0.35; text-decoration: line-through; }
      #ticket-items .next { opacity: 1; color: #d8473a; font-weight: bold; }
      #ticket-items .next img { animation: bob 0.6s infinite alternate ease-in-out; }
      @keyframes bob { to { transform: translateY(-3px) scale(1.12); } }
      /* Narrow screens: the ticket runs across the top, bottom bun on the left. */
      @media (max-width: 600px) {
        #ticket { top: 104px; left: 50%; transform: translateX(-50%); min-width: 0; padding: 5px 8px 6px; }
        #ticket.fresh { animation: slipN 0.45s cubic-bezier(.2,1.5,.4,1); }
        @keyframes slipN { from { transform: translate(-50%, -160%); } }
        #ticket h3 { font-size: 12px; margin-bottom: 2px; }
        #ticket-items { flex-direction: row; gap: 2px; }
        #ticket-items span { display: none; }
        #ticket-items img { width: 36px; height: 36px; }
        #ticket-items .done { text-decoration: none; }
        #ticket-items .next img { border-radius: 50%; box-shadow: 0 0 0 3px #d8473a; background: #ffe9e2; }
        #clock { left: 16px; top: 58px; transform: none; font-size: 30px; }
        #clock.hurry { animation: none; }
        #served { display: none; }
        #cash { font-size: 28px; }
        .pop.big { font-size: 24px; }
      }
      .pop { position: fixed; z-index: 5; pointer-events: none; font: 26px 'Kenney Bold', sans-serif; color: #ffd84a; transform: translate(-50%, -50%);
        white-space: nowrap; text-shadow: 0 3px 0 var(--shade), 0 -2px 0 var(--shade), 2px 0 0 var(--shade), -2px 0 0 var(--shade); animation: pop 1.1s ease-out forwards; }
      .pop.bad { color: #b8e05a; font-size: 32px; text-shadow: 0 3px 0 #3d5a1a, 0 -2px 0 #3d5a1a, 2px 0 0 #3d5a1a, -2px 0 0 #3d5a1a; }
      .pop.big { font-size: 34px; color: #fff; }
      .pop.time { font-size: 30px; color: #9ff09a; }
      @keyframes pop { 0% { transform: translate(-50%, -50%) scale(0.3); opacity: 0; } 15% { transform: translate(-50%, -60%) scale(1.15); opacity: 1; }
        70% { opacity: 1; } 100% { transform: translate(-50%, -200%) scale(1); opacity: 0; } }
      .card { position: fixed; z-index: 6; inset: 0; display: none; place-items: center; background: rgba(90, 40, 20, 0.3); }
      .card.show { display: grid; }
      .card > div { background: #d8473a; border: 4px solid rgba(255,255,255,0.5); border-radius: 22px; padding: 22px 26px 18px; color: #fff;
        font-family: 'Kenney Bold', sans-serif; text-align: center; max-width: 94vw; box-shadow: 0 10px 0 rgba(0,0,0,0.25); }
      .card h2 { margin: 0 0 10px; font-size: clamp(30px, 7vw, 46px); font-weight: normal; }
      .card .stats { display: flex; gap: 26px; justify-content: center; margin: 0 0 12px; }
      .card .stats div { font-size: clamp(30px, 7vw, 42px); }
      .card .stats small { display: block; font-size: 14px; color: var(--gold); }
      .card p { margin: 0 0 14px; color: var(--gold); }
      .card .btn { font-size: 22px; padding: 12px 34px; }
      #title { background: none; place-items: start center; padding-top: 9vh; }
      #title > div { background: none; border: none; box-shadow: none; text-shadow: 0 5px 0 var(--shade), 0 -3px 0 var(--shade), 3px 0 0 var(--shade), -3px 0 0 var(--shade); }
      #title h1 { margin: 0 0 14px; font-size: clamp(50px, 12vw, 100px); font-weight: normal; line-height: 1; }
      #title .btn { font-size: 26px; padding: 14px 44px; text-shadow: none; }
      #title p { margin: 12px 0 0; }
      #title .keys { font-family: 'Kenney Future', sans-serif; font-size: 14px; color: #fff; }
      @media (pointer: coarse) { #title .keys.mouse { display: none; } }
      @media (pointer: fine) { #title .keys.touch { display: none; } }
      body.on-title .hud, body.on-title #ticket { display: none !important; }
    </style>
  </head>
  <body class="on-title">
    <div id="stage"></div>
    <div id="clock" class="hud">1:30</div>
    <div id="cash" class="hud">$0</div>
    <div id="served" class="hud"></div>
    <div id="ticket"><h3><span>ORDER</span><span id="ticket-no">#1</span></h3><div id="ticket-items"></div></div>
    <div id="over" class="card"><div>
      <h2 id="over-title">Shift over!</h2>
      <div class="stats"><div><span id="over-served">0</span><small>BURGERS</small></div><div><span id="over-cash">$0</span><small>EARNED</small></div></div>
      <p id="over-note"></p>
      <button id="over-go" class="btn">Another shift</button>
    </div></div>
    <div id="title" class="card show"><div>
      <h1>BURGER STACK</h1>
      <button id="title-play" class="btn">Open the grill</button>
      <p id="title-best"></p>
      <p class="keys mouse">Move the plate with the mouse or arrow keys, and catch what the ticket says, in order</p>
      <p class="keys touch">Drag to move the plate, and catch what the ticket says, in order</p>
    </div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
