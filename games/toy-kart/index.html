<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Toy Kart</title>
    <style>
      html:root { --bg: #e9dcc8; --ink: #ffffff; --shade: #5a3415; --gold: #ffe27a; }
      body { overflow: hidden; user-select: none; -webkit-user-select: none; }
      #stage { position: fixed; inset: 0; touch-action: none; }
      .hud { position: fixed; z-index: 4; pointer-events: none; color: var(--ink); font-family: 'Kenney Bold', sans-serif;
        text-shadow: 0 3px 0 var(--shade), 0 -2px 0 var(--shade), 2px 0 0 var(--shade), -2px 0 0 var(--shade); }
      #pos { top: 70px; left: 14px; font-size: clamp(44px, 9vw, 72px); line-height: 1; }
      #pos small { font-size: 0.45em; margin-left: 2px; }
      #lap { top: 12px; left: 50%; transform: translateX(-50%); font-size: clamp(20px, 4vw, 30px); white-space: nowrap; }
      #time { top: 50px; left: 50%; transform: translateX(-50%); font-size: clamp(15px, 2.8vw, 20px); color: var(--gold); }
      #coinbox { top: clamp(128px, 22vw, 150px); left: 16px; font-size: clamp(20px, 4vw, 28px); display: flex; align-items: center; gap: 6px; }
      #coinbox img { width: 30px; height: 30px; }
      #item { top: 12px; right: 14px; width: 72px; height: 72px; border-radius: 16px; background: rgba(90, 52, 21, 0.45) center / 60px no-repeat;
        border: 4px solid rgba(255, 255, 255, 0.7); }
      #item.flash { animation: flash 0.5s; }
      @keyframes flash { 0% { transform: scale(1.4); } 100% { transform: scale(1); } }
      #minimap { position: fixed; z-index: 4; right: 14px; top: 100px; width: 150px; height: 150px; pointer-events: none; opacity: 0.9; }
      #banner { top: 34%; left: 50%; transform: translate(-50%, -50%) scale(0.4); font-size: clamp(44px, 11vw, 96px); opacity: 0;
        transition: transform 0.3s cubic-bezier(.2,1.6,.4,1), opacity 0.2s; white-space: nowrap; text-align: center; }
      #banner.show { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      #banner small { display: block; font-size: 0.34em; color: var(--gold); }
      #touch { position: fixed; inset: auto 0 0 0; z-index: 5; display: none; justify-content: space-between; padding: 0 14px 18px; pointer-events: none; }
      @media (pointer: coarse) { #touch { display: flex; } }
      #touch > div { display: flex; gap: 12px; }
      .tb { pointer-events: auto; width: 82px; height: 82px; border-radius: 50%; border: 4px solid rgba(255,255,255,0.75); background: rgba(90,52,21,0.4);
        color: #fff; font: 30px 'Kenney Bold', sans-serif; display: grid; place-items: center; touch-action: none; }
      .tb.down { background: rgba(255,255,255,0.45); }
      .tb.small { width: 66px; height: 66px; font-size: 12px; align-self: end; }
      #t-item { background: rgba(90,52,21,0.4) center / 54px no-repeat; }
      .card { position: fixed; z-index: 6; inset: 0; display: none; place-items: center; background: rgba(60, 35, 15, 0.35); }
      .card.show { display: grid; }
      .card > div { background: #c25b2a; border: 4px solid rgba(255,255,255,0.45); border-radius: 22px; padding: 22px 22px 18px; color: #fff;
        font-family: 'Kenney Bold', sans-serif; text-align: center; max-width: 94vw; box-shadow: 0 10px 0 rgba(0,0,0,0.25); }
      .card h2 { margin: 0 0 12px; font-size: clamp(30px, 7vw, 46px); font-weight: normal; }
      .card table { border-collapse: collapse; margin: 0 auto 14px; font-size: clamp(14px, 3vw, 19px); }
      .card td, .card th { padding: 5px 10px; border-bottom: 1px solid rgba(255,255,255,0.25); font-weight: normal; text-align: left; }
      .card th { color: var(--gold); }
      .card tr.me td { color: var(--gold); }
      .card p { margin: 0 0 14px; color: var(--gold); }
      .card .btn { font-size: 20px; }
      #title { background: none; place-items: end center; padding-bottom: 6vh; }
      #title > div { background: none; border: none; box-shadow: none; text-shadow: 0 5px 0 var(--shade), 0 -3px 0 var(--shade), 3px 0 0 var(--shade), -3px 0 0 var(--shade); }
      #title h1 { margin: 0; font-size: clamp(52px, 12vw, 104px); font-weight: normal; line-height: 1; }
      #title .picker { display: flex; align-items: center; justify-content: center; gap: 14px; margin: 10px 0 16px; font-size: clamp(20px, 4.5vw, 30px); }
      #title .picker .btn { font-size: 22px; padding: 6px 16px; text-shadow: none; }
      #car-name { min-width: 7em; }
      #title-play { font-size: 26px; padding: 14px 40px; text-shadow: none; }
      #title p { margin: 10px 0 0; }
      #title .keys { font-family: 'Kenney Future', sans-serif; font-size: 14px; color: #fff; opacity: 0.9; }
      /* Phones: clear the "All toys" link, shrink the map, and the item shows on its button. */
      @media (max-width: 700px) {
        #lap { top: 62px; }
        #time { top: 94px; }
        #pos { top: 70px; }
        #minimap { width: 96px; height: 96px; top: 96px; }
        #item { width: 56px; height: 56px; background-size: 46px; }
      }
      @media (pointer: coarse) { #item, #title .keys { display: none; } }
      body.on-title .hud, body.on-title #minimap, body.on-title #touch { display: none !important; }
    </style>
  </head>
  <body class="on-title">
    <div id="stage"></div>
    <div id="pos" class="hud"></div>
    <div id="lap" class="hud"></div>
    <div id="time" class="hud"></div>
    <div id="coinbox" class="hud"><img id="coin-icon" alt="" /><span id="coins">0</span></div>
    <div id="item" class="hud"></div>
    <canvas id="minimap" width="300" height="300"></canvas>
    <div id="banner" class="hud"></div>
    <div id="touch">
      <div><button id="t-left" class="tb">◀</button><button id="t-right" class="tb">▶</button></div>
      <div><button id="t-brake" class="tb small">BRAKE</button><button id="t-item" class="tb"></button></div>
    </div>
    <div id="results" class="card"><div><h2 id="results-title"></h2><table id="results-table"></table><p id="results-note"></p><button id="results-go" class="btn">Next</button></div></div>
    <div id="title" class="card show"><div>
      <h1>TOY KART</h1>
      <div class="picker"><button id="car-prev" class="btn">◀</button><span id="car-name"></span><button id="car-next" class="btn">▶</button></div>
      <button id="title-play" class="btn">Race!</button>
      <p id="title-best"></p>
      <p class="keys">Arrows or WASD to drive · Space to use an item</p>
    </div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
