<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Coaster Builder</title>
    <style>
      html:root { --bg: #9fd6f2; --shade: #7a2e1c; --gold: #ffd23f; }
      body { overflow: hidden; user-select: none; -webkit-user-select: none; }
      #stage { position: fixed; inset: 0; touch-action: none; }
      .hud { position: fixed; z-index: 4; pointer-events: none; color: #fff; font-family: 'Kenney Bold', sans-serif;
        text-shadow: 0 3px 0 var(--shade), 0 -2px 0 var(--shade), 2px 0 0 var(--shade), -2px 0 0 var(--shade); }
      #title { top: 10px; left: 50%; transform: translateX(-50%); font-size: clamp(22px, 4.5vw, 34px); white-space: nowrap; text-align: center; }
      #title small { display: block; font-size: 0.5em; color: var(--gold); }
      #toast { top: 30%; left: 50%; transform: translate(-50%, -50%); font-size: clamp(18px, 3.5vw, 26px); opacity: 0;
        transition: opacity 0.3s; text-align: center; width: min(90vw, 560px); }
      #toast.show { opacity: 1; }
      #dock { position: fixed; z-index: 5; left: 0; right: 0; bottom: 0; padding: 8px 10px 10px; display: grid; gap: 8px;
        background: linear-gradient(to top, rgba(90, 30, 20, 0.55), rgba(90, 30, 20, 0)); }
      #actions { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      #actions .btn { font-size: 16px; }
      #actions .btn:disabled { opacity: 0.5; }
      #ride { background: #e8473a; font-size: 20px !important; padding-left: 26px; padding-right: 26px; }
      #palette { display: flex; gap: 6px; overflow-x: auto; padding: 4px 2px 6px; scrollbar-width: thin; justify-content: safe center; }
      #palette button { flex: 0 0 auto; width: 76px; padding: 6px 2px 6px; display: grid; justify-items: center; gap: 2px;
        font-size: 10.5px; line-height: 1.1; background: #c4532f; }
      #palette svg { width: 42px; height: 42px; fill: none; stroke: #fff; stroke-width: 4.5; stroke-linecap: round; stroke-linejoin: round; }
      #palette svg circle { fill: #ffd23f; stroke: none; }
      #palette button.off { background: #8a7a74; opacity: 0.6; }
      #palette button.nope { animation: nope 0.35s; }
      @keyframes nope { 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
      /* Riding: the dock goes, a speedo and g meter come up. */
      #rideHud { position: fixed; z-index: 5; left: 0; right: 0; bottom: 14px; display: none; justify-content: center; align-items: end; gap: 26px; }
      #rideHud .gauge { font: 44px 'Kenney Bold', sans-serif; color: #fff; text-align: center; line-height: 1;
        text-shadow: 0 3px 0 var(--shade), 0 -2px 0 var(--shade), 2px 0 0 var(--shade), -2px 0 0 var(--shade); }
      #rideHud small { display: block; font-size: 13px; color: var(--gold); }
      #gforce.hot { color: #ffb0a0; }
      #gforce.float { color: #b8f0ff; }
      #rideHud .btn { font-size: 15px; }
      body.riding #dock, body.riding #title, body.reporting #dock { display: none; }
      body.riding #rideHud { display: flex; }
      .card { position: fixed; z-index: 6; inset: 0; display: none; place-items: center; background: rgba(60, 20, 10, 0.3); }
      body.reporting #report { display: grid; }
      .card > div { background: #c4532f; border: 4px solid rgba(255,255,255,0.5); border-radius: 22px; padding: 20px 24px 18px; color: #fff;
        font-family: 'Kenney Bold', sans-serif; text-align: center; max-width: 94vw; box-shadow: 0 10px 0 rgba(0,0,0,0.25); }
      .card h2 { margin: 0; font-size: clamp(30px, 7vw, 46px); font-weight: normal; }
      #report-stars { font-size: 40px; letter-spacing: 4px; margin: 2px 0 8px; color: rgba(0,0,0,0.25); }
      #report-stars .on { color: var(--gold); text-shadow: 0 3px 0 var(--shade); }
      .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px 18px; margin: 0 0 12px; }
      .stats div { font-size: clamp(24px, 6vw, 32px); }
      .stats small { display: block; font-size: 12px; color: var(--gold); }
      .card p { margin: 0 0 12px; color: var(--gold); max-width: 380px; font-size: 15px; }
      .card .btn { font-size: 18px; padding: 10px 22px; margin: 0 4px; }
      @media (max-width: 700px) {
        #title { top: 56px; }
        #actions .btn { font-size: 13px; padding: 7px 10px; }
        #ride { font-size: 16px !important; }
        #palette button { width: 64px; font-size: 9.5px; }
        #palette svg { width: 34px; height: 34px; }
        #rideHud { gap: 10px; flex-wrap: wrap; }
        #rideHud .gauge { font-size: 30px; }
        #rideHud small { font-size: 10px; }
        #rideHud .btn { font-size: 12px; padding: 7px 9px; }
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="title" class="hud">Coaster Builder<small id="count"></small></div>
    <div id="toast" class="hud"></div>
    <div id="dock">
      <div id="actions">
        <button id="ride" class="btn">Ride it!</button>
        <button id="undo" class="btn">Undo</button>
        <button id="surprise" class="btn">Surprise me</button>
        <button id="clear" class="btn">Clear</button>
      </div>
      <div id="palette"></div>
    </div>
    <div id="rideHud">
      <div class="gauge"><span id="speed">0</span><small>KM/H</small></div>
      <div class="gauge"><span id="gforce">1.0g</span><small>G FORCE</small></div>
      <button id="view" class="btn">Chase view</button>
      <button id="stop" class="btn">Stop</button>
    </div>
    <div id="report" class="card"><div>
      <h2 id="report-title">Wild!</h2>
      <div id="report-stars"></div>
      <div class="stats">
        <div><span id="r-speed">0</span><small>KM/H TOP SPEED</small></div>
        <div><span id="r-drop">0</span><small>M BIGGEST DROP</small></div>
        <div><span id="r-g">0</span><small>G MOST</small></div>
        <div><span id="r-air">0</span><small>S AIRTIME</small></div>
        <div><span id="r-loops">0</span><small>LOOPS</small></div>
        <div><span id="r-length">0</span><small>M OF TRACK</small></div>
      </div>
      <p id="report-note"></p>
      <button id="again" class="btn">Ride again</button><button id="build" class="btn">Build more</button>
    </div></div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
