<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:," />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#2b2d42" />
    <title>Join a party · Kenney Toys</title>
  </head>
  <body>
    <form id="join" class="join" autocomplete="off">
      <h1>Join the party</h1>
      <p class="lead">Type the code on the TV.</p>
      <label>Room code
        <input id="code" name="code" maxlength="4" inputmode="text" autocapitalize="characters" spellcheck="false" placeholder="ABCD" required />
      </label>
      <label>Your name
        <input id="name" name="name" maxlength="14" autocapitalize="words" spellcheck="false" placeholder="Name" required />
      </label>
      <p id="error" class="error" role="alert"></p>
      <button class="primary" type="submit">Join</button>
    </form>
    <div id="app" hidden></div>
    <div id="status" class="status" hidden><div><span class="spinner"></span><span id="status-text"></span></div></div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
